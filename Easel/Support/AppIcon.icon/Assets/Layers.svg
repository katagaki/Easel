  <!--
    The layers glyph: three canvases stacked back to front, each stepping up
    in opacity so the stack reads as depth. The front canvas is framed like a
    photo, a sun over hills in its window, and the canvases behind show
    through around them. Drawn in white: Icon Composer tints and lights the
    layer, so the artwork carries only shape and opacity.
  -->
